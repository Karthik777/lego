[project]
name = "fhoat"
version = "0.1.0"
description = "Oat UI for FastHTML: a drop-in for Pico. fast_app(oat=True)"
authors = [{ name = "Karthik Rajgopal", email = "karthik.rajgopal@hotmail.com" }]
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["python-fasthtml>=0.12"]

[project.urls]
Homepage = "https://github.com/Karthik777/lego/tree/main/fhoat"

[tool.hatch.build.targets.wheel]
packages = ["fhoat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
